name: Build release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 1.0.1'
        required: true
        default: '1.0.1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PversionName=${{ inputs.version }} -PversionCode=${{ github.run_number }} --console=plain

      - name: Rename APK with version
        run: cp app/build/outputs/apk/release/app-release.apk "Jarly-v${{ inputs.version }}.apk"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" "Jarly-v${{ inputs.version }}.apk" --title "Jarly v${{ inputs.version }}" --generate-notes --target main
